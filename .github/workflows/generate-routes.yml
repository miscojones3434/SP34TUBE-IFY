name: Generar rutas Flutter

on:
  push:
    paths:
      - "lib/collections/routes.dart"
      - "lib/pt34/pages/**"
      - "pubspec.yaml"
      - ".github/workflows/generate-routes.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-routes:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.0"
          channel: stable
          cache: true

      - name: Descargar dependencias
        run: flutter pub get

      - name: Generar rutas y archivos automáticos
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Guardar archivos generados
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add lib/collections/routes.gr.dart
            git commit -m "Generar rutas SP34TUBE-IFY [skip ci]"
            git push
          else
            echo "No hay archivos generados pendientes"
          fi
