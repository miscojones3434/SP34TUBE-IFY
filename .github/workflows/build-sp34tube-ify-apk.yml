name: Compilar APK SP34TUBE-IFY

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Crear APK Android
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"
          cache: gradle

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2.18.0
        with:
          flutter-version: "3.35.2"
          channel: stable
          cache: true

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Mostrar versiones
        run: |
          flutter --version
          dart --version
          java -version
          rustc --version

      - name: Crear firma temporal de prueba
        run: |
          keytool -genkeypair -noprompt \
            -keystore android/app/sp34tube-ify-test.jks \
            -storepass android \
            -keypass android \
            -alias sp34tubeify \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=SP34TUBE-IFY, OU=PT34, O=PT34, L=Spain, S=Spain, C=ES"

          cat > android/key.properties <<'EOF'
          storePassword=android
          keyPassword=android
          keyAlias=sp34tubeify
          storeFile=sp34tube-ify-test.jks
          EOF

      - name: Preparar variables de compilación
        run: |
          cat > .env <<'EOF'
          ENABLE_UPDATE_CHECK=0
          LASTFM_API_KEY=
          LASTFM_API_SECRET=
          RELEASE_CHANNEL=stable
          HIDE_DONATIONS=1
          EOF

      - name: Descargar dependencias Flutter
        run: flutter pub get

      - name: Instalar dependencias Android de Spotube
        run: |
          dart cli/cli.dart install-dependencies \
            --platform=android \
            --arch=all

      - name: Compilar APK Android
        env:
          CHANNEL: stable
          FLUTTER_VERSION: "3.35.2"
          DOTENV: |
            ENABLE_UPDATE_CHECK=0
            LASTFM_API_KEY=
            LASTFM_API_SECRET=
            RELEASE_CHANNEL=stable
            HIDE_DONATIONS=1
        run: |
          dart cli/cli.dart build --arch=all android

          test -s build/Spotube-android-all-arch.apk

          cp build/Spotube-android-all-arch.apk \
            build/SP34TUBE-IFY-test.apk

      - name: Publicar APK descargable
        uses: actions/upload-artifact@v4
        with:
          name: SP34TUBE-IFY-APK
          path: build/SP34TUBE-IFY-test.apk
          if-no-files-found: error
          retention-days: 14
