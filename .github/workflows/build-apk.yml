name: Compilar APK SP34TUBE-IFY

on:
  workflow_dispatch:
  push:
    branches:
      - Create-branch-sp34tube-ify-integration-from-master

permissions:
  contents: read

jobs:
  build-android:
    name: Compilar APK Android
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Mostrar versiones
        run: |
          flutter --version
          dart --version
          java -version

      - name: Comprobar proyecto
        run: flutter doctor -v

      - name: Descargar dependencias
        run: flutter pub get

      - name: Analizar código
        run: flutter analyze

      - name: Compilar APK release
        run: flutter build apk --release

      - name: Subir APK compilada
        uses: actions/upload-artifact@v4
        with:
          name: SP34TUBE-IFY-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
