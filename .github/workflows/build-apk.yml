name: Compilar APK SP34TUBE-IFY

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Compilar APK Android
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Descargar rama seleccionada
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Instalar Flutter del proyecto
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.2"
          channel: stable
          cache: true

      - name: Mostrar versiones
        run: |
          flutter --version
          dart --version
          java -version

      - name: Crear archivo de entorno
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_API_SECRET: ${{ secrets.LASTFM_API_SECRET }}
        run: |
          cat > .env <<EOF
          ENABLE_UPDATE_CHECK=0
          LASTFM_API_KEY=${LASTFM_API_KEY}
          LASTFM_API_SECRET=${LASTFM_API_SECRET}
          RELEASE_CHANNEL=stable
          HIDE_DONATIONS=1
          EOF

      - name: Descargar dependencias
        run: flutter pub get

      - name: Generar archivos requeridos
        run: |
          dart run build_runner build --delete-conflicting-outputs
          test -s lib/collections/env.g.dart

      - name: Analizar código sin detener compilación
        continue-on-error: true
        run: flutter analyze

      - name: Compilar APK release
        run: flutter build apk --release

      - name: Subir APK compilada
        uses: actions/upload-artifact@v4
        with:
          name: SP34TUBE-IFY-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
