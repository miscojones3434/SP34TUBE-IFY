targets:
  $default:
    sources:
      exclude:
        - bin/*.dart

    builders:
      auto_route_generator:auto_route_generator:
        options:
          enable_cached_builds: true
        generate_for:
          - lib/pages/**.dart
          - lib/pt34/pages/**.dart

      auto_route_generator:auto_router_generator:
        options:
          enable_cached_builds: true
        generate_for:
          - lib/collections/routes.dart

      json_serializable:
        options:
          any_map: true
          explicit_to_json: true

      drift_dev:
        options:
          databases:
            app_db: lib/models/database/database.dart
          sql:
            dialect: sqlite
            options:
              modules:
                - json1
